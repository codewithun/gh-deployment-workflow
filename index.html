
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions Deployment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        main {
            text-align: center;
            padding: 48px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #00000012;
        }

        h1 {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <main>
        <h1>Hello, GitHub Actions!</h1>
        <p>This website is deployed automatically with GitHub Pages.</p>
        <p>Every update to index.html triggers deployment.</p>
    </main>
</body>
</html>
